name: Test run

on:
    push:
        branches: [ "main" ]
    # declachment en cas de pull request 
    pull_request:
        branches: [ "main" ]
    workflow_dispatch:

# Moindre privilège : le token GitHub ne peut que lire le code
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"
        cache: maven

    - name: Tests backend
      working-directory: backend
      run: mvn -B test

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Tests frontend
      working-directory: frontend
      run: |
        npm ci
        npx ng test --watch=false

  build:
    needs: test 
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   #Pour pousser sur ghrc.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          pull: true   # toujours repartir de la dernière image de base (correctifs sécurité)
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/mohamed22007/prj-backend:${{ github.sha }}
            ghcr.io/mohamed22007/prj-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend
        uses: docker/build-push-action@v6
        with: 
          context: ./frontend
          pull: true
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/mohamed22007/prj-frontend:${{ github.sha }}
            ghcr.io/mohamed22007/prj-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lancer la stack
        run: |
          cp .env.example .env
          if [ "${{ github.event_name }}" = "push" ]; then 
            TAG=${{ github.sha }} docker compose pull 
            TAG=${{ github.sha }} docker compose up -d --no-build
          else 
            docker compose up -d --build
          fi 
      - run: ./smoke_test.sh http://localhost
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
      

  deploy:
    needs: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    permissions:
      id-token: write   # permet à GitHub de fabriquer le jeton OIDC
      contents: read    # nécessaire pour actions/checkout
    steps:
      - uses: actions/checkout@v4

      - name: Identifiants AWS temporaires (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-3

      - name: Deployer via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # Les commandes que le serveur va exécuter (en root)
          PARAMS=$(jq -n --arg sha "$SHA" --arg repo "$REPO" '{commands: [
            "set -e",
            "cd /opt/prj",
            "curl -fsSL https://raw.githubusercontent.com/\($repo)/\($sha)/docker-compose.yml -o docker-compose.yml",
            "chown ubuntu:ubuntu docker-compose.yml",
            "export TAG=\($sha)",
            "for i in 1 2 3; do docker compose pull && break; echo retry; sleep 10; done",
            "docker compose up -d --no-build --remove-orphans",
            "docker image prune -f"
          ]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $SHA" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "CommandId : $CMD_ID"

          # Attendre la fin (jusqu'à 5 min)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done

          # Afficher la sortie du serveur dans les logs GitHub
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "Statut final : $STATUS"
          test "$STATUS" = "Success"

      - name: Smoke test en production
        run: ./smoke_test.sh http://${{ secrets.EC2_HOST }}
    
