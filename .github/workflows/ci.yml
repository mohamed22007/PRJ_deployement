name: Test run

on:
    push:
        branches: [ "main" ]
    # declachment en cas de pull request 
    #pull_request:
    #    barnches: [ "main" ]

jobs:
    run-tests:
        runs-on: ubuntu-latest

        steps:
            #1 - clone le code sur le serveur
            - name: recuperer le site web
              uses: actions/checkout@v4

            # Installation docker 
            - name: docker
              run: make install
            #2 - Executer et compiler le site 
            - name: run
              env:
                DB_NAME: test_db
                DB_USER: test_user
                DB_CODE: test_password
              run: make run

            #3 - Netoyyer 
            - name: clean
              run: make clean
