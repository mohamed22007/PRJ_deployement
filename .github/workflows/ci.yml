name: Test run

on:
    #push:
    #    branches: [ "main" ]
    # declachment en cas de pull request 
    #pull_request:
    #    barnches: [ "main" ]
    workflow_dispatch:

# Moindre privilège : le token GitHub ne peut que lire le code
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"
        cache: maven

    - name: Tests backend
      working-directory: backend
      run: mvn -B test

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Tests frontend
      working-directory: frontend
      run: |
        npm ci
        npx ng test --watch=false

  build:
    needs: test 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire les images
        run: |
          cp .env.example .env
          docker compose build

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lancer la stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Smoke test
        run: ./smoke_test.sh http://localhost
      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs
      - name: Nettoyer
        if: always()
        run: docker compose down -v
    
