name: Test run

on:
    push:
        branches: [ "main" ]
    # declachment en cas de pull request 
    pull_request:
        branches: [ "main" ]
    workflow_dispatch:

# Moindre privilège : le token GitHub ne peut que lire le code
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"
        cache: maven

    - name: Tests backend
      working-directory: backend
      run: mvn -B test

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Tests frontend
      working-directory: frontend
      run: |
        npm ci
        npx ng test --watch=false

  build:
    needs: test 
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   #Pour pousser sur ghrc.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/mohamed22007/prj-backend:${{ github.sha }}
            ghcr.io/mohamed22007/prj-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend
        uses: docker/build-push-action@v6
        with: 
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/mohamed22007/prj-frontend:${{ github.sha }}
            ghcr.io/mohamed22007/prj-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lancer la stack
        run: |
          cp .env.example .env
          if [ "${{ github.event_name }}" = "push" ]; then 
            TAG=${{ github.sha }} docker compose pull 
            TAG=${{ github.sha }} docker compose up -d --no-build
          else 
            docker compose up -d --build
          fi 
      - run: ./smoke_test.sh http://localhost
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
      
  deploy:
    needs: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    steps:
      - uses: actions/checkout@v4
      - name: Preparer ssh 
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      - name: Deployer
        run: |
          scp docker-compose.yml ubuntu@${{ secrets.EC2_HOST }}:/opt/prj/docker-compose.yml
          ssh ubuntu@${{ secrets.EC2_HOST }} "cd /opt/prj \
          && TAG=${{ github.sha }} docker compose pull \
          && TAG=${{ github.sha }} docker compose up -d --no-build --remove-orphans \
          && docker image prune -f"
      - name: Smoke test en production 
        run: ./smoke_test.sh http://${{ secrets.EC2_HOST }}


    
