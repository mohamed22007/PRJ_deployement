<div class="login-container">
  <h1>Connexion</h1>
  
  <input type="text" 
         [(ngModel)]="username" 
         placeholder="username">
  <br>

  <input type="password" 
         [(ngModel)]="password" 
         placeholder="Mot de pass">
  <br>
  <button (click)="onLogin()">Se connecter</button>
  <br>
  <button (click)="onRegistre()">Creation de compte</button>
</div>
