- name: Installer docker et deployer le projet
  hosts: app
  become: true
  vars:
    app_dir: /opt/prj
  
  tasks:
    - name: Paquests de base
      ansible.builtin.apt:
        name: [ca-certificates, curl]
        update_cache: true
      
    - name: Dossier des clés apt 
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Clé GPG Docker 
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Dépot APT docker 
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable "
        filename: docker

    - name: Installer Docker te les plugins compose
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        update_cache: true

    - name: Docker demarre au boot 
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Utiliser ubuntu dans le groupe docker 
      ansible.builtin.user:
        name: ubuntu
        groups: docker 
        append: true
    
    # 2 Go de swap : le t3.micro n'a que 1 Go de RAM (Spring + Postgres + Nginx)
    - name: Creer le ficher swap
      ansible.builtin.command: fallocate -l 2G /swapfile
      args:
        creates: /swapfile
      register: swap

    - name: Activer le swap 
      when: swap.changed
      ansible.builtin.shell: chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile

    - name: Swap permanent
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0 "


    # le serveur ne compile plus rien, il télécharge les images de GHCR.
    # docker-compose.yml et lancer docker compose sans sudo.
    - name: Dossier de l'application
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copier docker-compose.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker-compose.yml"
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Copier .env (secrets, jamais dans Git)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../.env"
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Lancer la stack depuis les images GHCR (tag latest)
      ansible.builtin.shell: docker compose pull && docker compose up -d --no-build --remove-orphans
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu
      changed_when: true
